<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FANUC Backup Viewer</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <!-- the app's navigation. A solo pop-out shows the wordmark instead (CSS,
         keyed on body.solo): it has nowhere to navigate TO, and the missing
         buttons are how you tell which window is the main one. -->
    <div id="topbar-cubes" aria-label="main navigation">
      <button class="cube" id="cube-lib" title="library — the robot list">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.5C10.2 5.2 7.9 4.6 5 4.6a1 1 0 0 0-1 1v11.2a1 1 0 0 0 1 1c2.9 0 5.2.6 7 1.9 1.8-1.3 4.1-1.9 7-1.9a1 1 0 0 0 1-1V5.6a1 1 0 0 0-1-1c-3.1 0-5.4.6-7 1.9z"/>
          <path d="M12 6.5v13.2"/>
        </svg>
      </button>
      <button class="cube" id="cube-cam" title="multi-cam — live camera tiles">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.7l1.2-2h5.2l1.2 2h4.7A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
      </button>
      <button class="cube" id="cube-edit"
              title="the edit workspace — programs you are editing across robots">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M2.7 11.4c2.2.5 3.8.1 4.8-.7h7.6c.6 0 1.1.5 1.1 1.1 0 1.8-1.2 3.4-2.8 4l.6 1.6h1.4c.5 0 .9.4.9.9v1H7.7v-1c0-.5.4-.9.9-.9H10l.6-1.6c-1.2-.5-2-1.4-2.4-2.4-1.2.7-2.9.9-5.1.4a.68.68 0 0 1 0-1.4z"/>
          <rect fill="currentColor" x="8.3" y="3.6" width="6" height="2.9" rx="0.5"/>
          <path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M14.8 5.1l4.3-1.5"/>
          <path stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M9.5 8.1l-.6 1.3M12.3 8.1l.6 1.3"/>
        </svg>
        <span class="cube-badge hidden"></span>
      </button>
    </div>
    <div id="logo" title="backupviewer">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M12 2 2 7v10l10 5 10-5V7L12 2zm0 2.2 7.5 3.75L12 11.7 4.5 7.95 12 4.2zM4 9.6l7 3.5v6.7l-7-3.5V9.6zm16 0v6.7l-7 3.5v-6.7l7-3.5z"/>
      </svg>
      <span class="logo-text">backup<span class="logo-accent">viewer</span></span>
    </div>
    <nav id="sessionbar" aria-label="open backups" class="hidden"></nav>
    <div id="topbar-right">
      <div class="search-box" id="global-search" title="search the whole backup (ctrl+k)">
        <span class="si">⌕</span>
        <input type="text" placeholder="search backup…" spellcheck="false">
      </div>
      <button class="icon-btn" id="btn-compare" title="compare with another backup">compare</button>
      <button class="icon-btn" id="btn-cog" title="settings — theme, interface, library (t)">⚙</button>
      <button class="icon-btn" id="btn-help" title="shortcuts (?)">?</button>
    </div>
  </header>
  <nav id="tabbar" aria-label="tabs"></nav>
  <div id="toolbar" class="hidden"></div>
  <main id="view" tabindex="-1"></main>
  <div id="jobstrip" class="hidden"></div>
  <footer id="statusbar">
    <span id="status-left"></span>
    <span id="status-right"></span>
  </footer>
</div>
<div id="modal-root" class="hidden"></div>

<script src="js/util.js"></script>
<script src="js/api.js"></script>

<script src="js/components/table.js"></script>
<script src="js/components/framecard.js"></script>
<script src="js/components/dragreorder.js"></script>
<script src="js/components/backuptabs.js"></script>
<script src="js/components/lseditor.js"></script>
<script src="js/components/proj3d.js"></script>
<script src="js/components/fk.js"></script>
<script src="js/tabs/overview.js"></script>
<script src="js/tabs/frames.js"></script>
<script src="js/tabs/io.js"></script>
<script src="js/tabs/registers.js"></script>
<script src="js/tabs/programs.js"></script>
<script src="js/tabs/edit.js"></script>
<script src="js/tabs/alarms.js"></script>
<script src="js/tabs/macros.js"></script>
<script src="js/tabs/dcs.js"></script>
<script src="js/tabs/sysvars.js"></script>
<script src="js/tabs/mhvalves.js"></script>
<script src="js/cvxremote.js"></script>
<script src="js/mtxremote.js"></script>
<script src="js/phoneview.js"></script>
<script src="js/tabs/photos.js"></script>

<script src="js/tabs/home.js"></script>
<script src="js/keys.js"></script>
<script src="js/router.js"></script>
</body>
</html>
