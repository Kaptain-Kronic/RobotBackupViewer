<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backup Viewer</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div id="app">
  <!-- the top chrome is ONE frosted slab floating over #view (scroll-under):
       #view pads itself by the slab's measured height (router.js) -->
  <div id="chrome-top">
  <header id="topbar">
    <!-- the app's navigation. A solo pop-out shows the wordmark instead (CSS,
         keyed on body.solo): it has nowhere to navigate TO, and the missing
         buttons are how you tell which window is the main one. -->
    <div id="topbar-cubes" aria-label="main navigation">
      <button class="cube" id="cube-lib" title="library — the robot list">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 6.5C10.2 5.2 7.9 4.6 5 4.6a1 1 0 0 0-1 1v11.2a1 1 0 0 0 1 1c2.9 0 5.2.6 7 1.9 1.8-1.3 4.1-1.9 7-1.9a1 1 0 0 0 1-1V5.6a1 1 0 0 0-1-1c-3.1 0-5.4.6-7 1.9z"/>
          <path d="M12 6.5v13.2"/>
        </svg>
      </button>
      <button class="cube" id="cube-cam" title="multi-cam — live camera tiles">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.5A1.5 1.5 0 0 1 4.5 7h2.7l1.2-2h5.2l1.2 2h4.7A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/>
          <circle cx="12" cy="13" r="3.5"/>
        </svg>
      </button>
      <button class="cube" id="cube-edit"
              title="the edit workspace — programs you are editing across robots">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.3 13.5 7 12.2h13.5v2.9h-4.3c-.8 1-1.6 1.5-1.6 2.5l3 2.5H6.4l3-2.5c0-1-.8-1.5-1.6-2.5H7z"/>
          <g transform="rotate(-28 10.5 5.9)">
            <rect x="8.65" y="2.7" width="3.7" height="6.4" rx="0.45"/>
            <path d="M12.35 5.9h6.8"/>
          </g>
        </svg>
        <span class="cube-badge hidden"></span>
      </button>
    </div>
    <div id="logo" title="backupviewer">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M12 2 2 7v10l10 5 10-5V7L12 2zm0 2.2 7.5 3.75L12 11.7 4.5 7.95 12 4.2zM4 9.6l7 3.5v6.7l-7-3.5V9.6zm16 0v6.7l-7 3.5v-6.7l7-3.5z"/>
      </svg>
      <span class="logo-text">backup<span class="logo-accent">viewer</span></span>
    </div>
    <nav id="sessionbar" aria-label="open backups" class="hidden"></nav>
    <!-- ONE button stands in for the tab strip: it names the current screen,
         its dropdown is the map (badges + availability), the number keys
         stay the fast path (router.js syncScreens) -->
    <button id="screens-btn" class="hidden" title="screens (1-9, 0, -, =)"></button>
    <div id="topbar-right">
      <!-- every screen's search lives HERE: backup screens use the global
           box below, shell screens mount their own filter box beside it
           (class screen-search, cleared by route()) -->
      <div id="topbar-search">
        <div class="search-box" id="global-search" title="search the whole backup (ctrl+k)">
          <span class="si">⌕</span>
          <input type="text" placeholder="search backup…" spellcheck="false">
        </div>
      </div>
      <button class="icon-btn ico" id="btn-phone" data-icon="phone" title="mirror this window to your phone (QR)"></button>
      <button class="icon-btn ico" id="btn-cog" data-icon="gear" title="settings — theme, interface, library (t)"></button>
      <button class="icon-btn ico" id="btn-help" data-icon="help" title="shortcuts (?)"></button>
    </div>
  </header>
  <!-- row 2: the current screen's OWN controls, directly above the content
       they modify (navigation above, context below - never interleaved) -->
  <div id="toolbar" class="hidden"></div>
  </div>
  <main id="view" tabindex="-1"></main>
  <!-- bottom slab: jobstrip + statusbar, same floating frost -->
  <div id="chrome-bottom">
  <div id="jobstrip" class="hidden"></div>
  <footer id="statusbar">
    <span id="status-left"></span>
    <span id="status-right"></span>
  </footer>
  </div>
</div>
<div id="modal-root" class="hidden"></div>
